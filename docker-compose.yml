services:
  bot:
    build: .
    restart: unless-stopped
    env_file:
      # Secrets/bootstrap config — see .env.example / docs/CONFIGURATION.md.
      # Not baked into the image; only ever supplied at run time.
      - ./.env
    environment:
      # LOG_DIR defaults to "<cwd>/../logs"; override so logs land inside
      # the mounted volume instead of outside the container's filesystem.
      LOG_DIR: /app/logs
    ports:
      # Only needed when the dashboard is enabled (WEB_ENABLED != "false" in
      # .env). Both sides come from WEB_PORT in .env (Compose reads that same
      # file for ${...} substitution here, separately from env_file above
      # injecting it into the container) so the mapping always matches what
      # the app actually listens on — no need to edit this file when you
      # change WEB_PORT. Remove this block entirely to keep the dashboard
      # unreachable from outside the container. See docs/DASHBOARD.md.
      - "${WEB_PORT:-3000}:${WEB_PORT:-3000}"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
